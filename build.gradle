plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.2-SNAPSHOT'
}

group = 'com.rafayshhh.brightness'
version = '1.0.0+mc1.12.2'
base.archivesName = 'shhh-brightness-toggle'

repositories {
    mavenCentral()
    maven {
        name = 'Mojang'
        url = 'https://libraries.minecraft.net/'
    }
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'WagYourTailReleases'
        url = 'https://maven.wagyourtail.xyz/releases'
    }
    maven {
        name = 'WagYourTailSnapshots'
        url = 'https://maven.wagyourtail.xyz/snapshots'
    }
}

repositories.configureEach { repo ->
    if (repo instanceof MavenArtifactRepository) {
        if (repo.url.toString().contains("neoforged.net")) {
            repo.content {
                includeGroupByRegex "net\\.neoforged.*"
                includeGroup "cpw.mods"
                includeGroup "de.oceanlabs.mcp"
            }
        }
    }
}

configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.name == 'scala-continuations-library_2.11' && details.requested.version == '1.0.2_mc') {
            details.useVersion '1.0.2'
        }
        if (details.requested.name == 'scala-continuations-plugin_2.11.1' && details.requested.version == '1.0.2_mc') {
            details.useVersion '1.0.2'
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}

unimined.minecraft {
    version '1.12.2'

    minecraftForge {
        loader '14.23.5.2860'
    }

    mappings {
        searge()
        mcp('stable', '39-1.12')
    }

    defaultRemapJar = true
}

processResources {
    inputs.property 'version', project.version

    filesMatching('mcmod.info') {
        expand 'version': project.version
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'shhh-brightness-toggle',
            'Specification-Vendor': 'RafayShhh',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'RafayShhh',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
