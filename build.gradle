plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.2-SNAPSHOT'
}

group = 'com.rafayshhh.brightness'
version = '1.0.0+mc1.8.9'
base.archivesName = 'shhh-brightness-toggle'

repositories {
    mavenCentral()
    maven {
        name = 'Mojang'
        url = 'https://libraries.minecraft.net/'
    }
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'WagYourTailReleases'
        url = 'https://maven.wagyourtail.xyz/releases'
    }
    maven {
        name = 'WagYourTailSnapshots'
        url = 'https://maven.wagyourtail.xyz/snapshots'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}

unimined.minecraft {
    version '1.8.9'

    minecraftForge {
        loader '11.15.1.2318-1.8.9'
    }

    mappings {
        searge()
        mcp('stable', '22-1.8.9')
    }

    defaultRemapJar = true
}

processResources {
    inputs.property 'version', project.version

    filesMatching('mcmod.info') {
        expand 'version': project.version
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'shhh-brightness-toggle',
            'Specification-Vendor'    : 'RafayShhh',
            'Specification-Version'   : '1.0.0',
            'Implementation-Title'    : 'shhh-brightness-toggle',
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'RafayShhh'
        ])
    }
}
