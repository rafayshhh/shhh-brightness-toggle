name: Bug Report
description: Create a report to help us improve Shhh Brightness Toggle
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below.
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Press 'B' key
        2. Adjust brightness
        3. ...
    validations:
      required: true
  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft Version
      placeholder: e.g. 26.3
      value: "26.3"
    validations:
      required: true
  - type: input
    id: mod_version
    attributes:
      label: Mod Version
      placeholder: e.g. 1.0.0
      value: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: mod_list
    attributes:
      label: Other Mods Installed
      description: Are you using Sodium, Iris, Mod Menu, or any other mods?
      placeholder: Sodium, Iris, Mod Menu, etc.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log / Crash Report
      description: Paste any crash logs or console output if available.
      render: text
    validations:
      required: false
