name: Feature Request
description: Suggest an idea or enhancement for Shhh Brightness Toggle
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Shhh Brightness Toggle? Let us know below!
  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: A clear and concise description of what you would like to happen.
      placeholder: Describe the feature or improvement...
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Problem or Motivation
      description: Why would this feature be useful?
      placeholder: What problem does it solve?
    validations:
      required: false
